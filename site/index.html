<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Race Stats</title>
<meta name="description" content="Toutes les stats de match race depuis 2011 : victoires, défaites, jaune vs bleu, face-à-face.">
<meta property="og:title" content="Match Race Stats">
<meta property="og:description" content="46 000+ matchs, 1 600 skippers : victoires, jaune vs bleu, face-à-face.">
<meta name="theme-color" content="#050a18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3 L16 27 L5 27 Z' fill='%232f6bff'/><path d='M18 7 L18 27 L28 27 Z' fill='%23ffc61a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="vendor/d3-array.min.js" defer></script><script src="vendor/d3-geo.min.js" defer></script><script src="vendor/topojson-client.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --bg:#050a18;--bg2:#0a1430;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);
  --ink:#eef2ff;--mut:#8b97b8;--yel:#ffc61a;--yel2:#ffde6b;--blu:#2f6bff;--blu2:#6f9bff;--win:#3ddc84;--loss:#ff5c6c;
  --disp:"Anton",Impact,"Arial Narrow Bold",sans-serif;--body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1840px;margin:0 auto;padding:0 28px 60px}
/* les titres d'events longs passent à la ligne au lieu de forcer un scroll horizontal */
td.l a[target=_blank]{white-space:normal;display:inline-block;min-width:130px;max-width:420px;line-height:1.3}
@media (max-width:1400px){.wrap{padding:0 16px 60px}.grid{gap:14px}.card{padding:16px 14px}}
.grid th,.grid td{padding:8px 7px}
a{color:var(--blu2);text-decoration:none}a:hover{color:#fff}

/* header */
header{display:flex;align-items:center;gap:20px;padding:18px 0;flex-wrap:wrap}
.logo{font:400 30px/0.95 var(--disp);letter-spacing:.5px;text-transform:uppercase;color:#fff;display:flex;gap:10px;align-items:center}
.logo svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,198,26,.45))}
.logo em{font-style:normal;background:linear-gradient(90deg,var(--blu2),var(--yel));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(10px)}
nav a{color:var(--mut);padding:7px 15px;border-radius:999px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
nav a.on{background:linear-gradient(90deg,var(--blu),#5b4dff);color:#fff;box-shadow:0 0 20px rgba(47,107,255,.45)}
nav a:hover{color:#fff}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(10,20,48,.75);color:var(--ink);outline:none}
select:focus,input:focus{border-color:var(--blu2);box-shadow:0 0 0 3px rgba(47,107,255,.25)}
.btn{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.8px;padding:8px 14px;border-radius:10px;border:0;cursor:pointer;color:#1b1400;
  background:linear-gradient(90deg,var(--yel),var(--yel2));box-shadow:0 0 18px rgba(255,198,26,.35)}
.btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111d42;border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:20;transition:.3s;font-weight:600}
.toast.on{transform:translateX(-50%) translateY(0)}

/* hero */
.hero{padding:34px 0 26px}
.hero h1{font:400 clamp(44px,8vw,104px)/.9 var(--disp);text-transform:uppercase;margin:0;letter-spacing:.5px}
.hero h1 .y{color:var(--yel);text-shadow:0 0 30px rgba(255,198,26,.45)}
.hero h1 .b{color:var(--blu2);text-shadow:0 0 30px rgba(47,107,255,.55)}
.kicker{font:700 12px var(--body);letter-spacing:3px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.hero p{color:var(--mut);max-width:680px;font-size:15px;margin:14px 0 0}
.counters{display:flex;gap:34px;margin-top:22px;flex-wrap:wrap}
.counters div b{display:block;font:400 40px/1 var(--disp);color:#fff}
.counters div span{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}

/* cards */
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h2{font:400 22px var(--disp);text-transform:uppercase;letter-spacing:.6px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.card h2 small{font:500 12px var(--body);color:var(--mut);text-transform:none;letter-spacing:0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.tile .v{font:400 34px/1.05 var(--disp);letter-spacing:.5px}
.tile .l{color:var(--mut);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.tile.y{border-color:rgba(255,198,26,.35);background:linear-gradient(140deg,rgba(255,198,26,.16),rgba(255,198,26,.02))}
.tile.y .v{color:var(--yel)}
.tile.b{border-color:rgba(47,107,255,.4);background:linear-gradient(140deg,rgba(47,107,255,.2),rgba(47,107,255,.02))}
.tile.b .v{color:var(--blu2)}

/* tables */
.scroll{max-height:640px;overflow:auto;margin:0 -8px;padding:0 8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font:600 10.5px var(--body);letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);cursor:pointer;user-select:none;position:sticky;top:0;background:#0b1430;z-index:1}
th[data-s=a]::after{content:" ▲";color:var(--yel)}th[data-s=d]::after{content:" ▼";color:var(--yel)}
th:first-child,td:first-child,.l{text-align:left}
tbody tr{transition:background .15s}
tbody tr:hover td{background:rgba(255,255,255,.035)}
.rank{font:400 18px var(--disp);color:var(--mut);width:36px}
tr:nth-child(1) .rank{color:var(--yel)}tr:nth-child(2) .rank{color:#d7def0}tr:nth-child(3) .rank{color:#e39b5b}
.nm{font-weight:600;color:#fff}.nm:hover{color:var(--yel)}
.cc{display:inline-block;font:700 9.5px var(--body);letter-spacing:1px;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-left:7px;vertical-align:1px}
.W{color:var(--win);font-weight:700}.L{color:var(--loss);font-weight:700}
.mut{color:var(--mut)}
.big{font:400 17px var(--disp);letter-spacing:.4px}
.meter{display:inline-block;width:76px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);vertical-align:middle;margin-left:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blu),var(--yel))}
.duel{display:inline-flex;width:110px;height:8px;border-radius:4px;overflow:hidden;vertical-align:middle;background:rgba(255,255,255,.06)}
.duel i{display:block;height:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.chip.yellow{color:var(--yel)}.chip.blue{color:var(--blu2)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--glass2);color:var(--mut);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.note{font-size:12px;color:var(--mut);margin-top:10px}

/* skipper hero */
.sk-hero{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:30px 0 22px}
.sk-hero h1{font:400 clamp(40px,7vw,88px)/.92 var(--disp);text-transform:uppercase;margin:0}
.sk-hero .meta{color:var(--mut);font-weight:600;letter-spacing:2px;text-transform:uppercase;font-size:12px}
.donut-wrap{margin-left:auto;display:flex;align-items:center;gap:22px}
.donut .seg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.donut .ctr{font-family:var(--disp);fill:#fff}
.donut .sub{font:700 5.5px var(--body);letter-spacing:.8px;fill:var(--mut);text-transform:uppercase}
.dleg{display:flex;flex-direction:column;gap:10px;font-size:12px}
.dleg div{display:flex;align-items:center;gap:9px}
.dleg i{width:12px;height:12px;border-radius:4px;flex:none}
.dleg b{font:400 22px/1 var(--disp);min-width:58px}
.dleg span{color:var(--mut);letter-spacing:1px;text-transform:uppercase;font-size:10.5px}
.gauge{margin-left:auto;min-width:300px;flex:0 1 420px}
.gauge .t{display:flex;justify-content:space-between;font:400 26px var(--disp)}
.gauge .t .y{color:var(--yel)}.gauge .t .b{color:var(--blu2)}
.gauge .track{height:14px;border-radius:7px;display:flex;overflow:hidden;margin:6px 0;box-shadow:0 0 24px rgba(47,107,255,.25)}
.gauge .lbl{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}

/* versus */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;padding:30px 0 10px}
.vs .side{padding:22px;border-radius:20px;border:1px solid var(--line);background:var(--glass);min-height:150px;display:flex;flex-direction:column;justify-content:center}
.vs .side.a{box-shadow:inset 0 0 60px rgba(47,107,255,.18);border-color:rgba(47,107,255,.4)}
.vs .side.bb{box-shadow:inset 0 0 60px rgba(255,198,26,.14);border-color:rgba(255,198,26,.4);text-align:right}
.vs .side .n{font:400 clamp(26px,4vw,46px)/1 var(--disp);text-transform:uppercase;margin-top:8px}
.vs .score{font:400 clamp(56px,9vw,110px)/1 var(--disp);text-align:center;text-shadow:0 0 30px rgba(255,255,255,.25)}
.vs .score small{display:block;font:600 11px var(--body);letter-spacing:3px;color:var(--mut);margin-top:6px}
.search{position:relative}
.search input{width:100%}
.sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#0d1838;border:1px solid var(--line);border-radius:12px;z-index:10;max-height:320px;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.sugg div{padding:9px 12px;cursor:pointer;text-align:left}.sugg div:hover{background:rgba(255,255,255,.06)}

/* split global */
.split{display:flex;height:84px;border-radius:18px;overflow:hidden;margin-bottom:18px;border:1px solid var(--line)}
.split div{display:flex;flex-direction:column;justify-content:center;padding:0 22px;font:400 44px/1 var(--disp)}
.split div span{font:700 11px var(--body);letter-spacing:2px;text-transform:uppercase;opacity:.85;margin-top:4px}
.split .sy{background:linear-gradient(90deg,#c79500,var(--yel));color:#1b1400}
.split .sb{background:linear-gradient(90deg,var(--blu),#1440b8);color:#fff;text-align:right;align-items:flex-end}
svg text{font:11px var(--body);fill:var(--mut)}
.legend{font-size:12px;color:var(--mut);display:flex;gap:16px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.loading{padding:120px 0;text-align:center;font:400 28px var(--disp);letter-spacing:2px;color:var(--mut);text-transform:uppercase}
footer{color:var(--mut);font-size:12px;text-align:center;padding-top:20px}
@media (max-width:720px){
  .wrap{padding:0 16px 40px}.grid{grid-template-columns:1fr}.tools{margin-left:0;width:100%}
  nav{overflow-x:auto;max-width:100%}nav a{padding:7px 11px}
  .vs{grid-template-columns:1fr}.vs .side.bb{text-align:left}.gauge{min-width:0;flex-basis:100%}.donut-wrap{margin-left:0}
  .hide-m{display:none}.split div{font-size:32px;padding:0 14px}
}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.flg{width:20px;height:14px;object-fit:cover;margin-left:7px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.flg.big{width:54px;height:38px;margin:0;vertical-align:middle}
.gr{display:inline-block;font:700 10px var(--body);letter-spacing:1px;padding:2px 6px;border:1px solid var(--line);color:var(--mut);min-width:26px;text-align:center}
.gr.gW{color:#1b1400;background:linear-gradient(90deg,var(--yel),var(--yel2));border-color:transparent;box-shadow:0 0 10px rgba(255,198,26,.4)}
.gr.g1{color:#fff;background:var(--blu);border-color:transparent}
.gr.g2{color:var(--blu2);border-color:var(--blu2)}
.avatar{width:92px;height:92px;display:flex;align-items:center;justify-content:center;font:400 40px var(--disp);color:#fff;position:relative;
  background:linear-gradient(135deg,var(--blu),#5b4dff 55%,var(--yel));box-shadow:0 0 30px rgba(47,107,255,.45);flex:none}
.avatar .flg{position:absolute;right:-8px;bottom:-6px;width:34px;height:24px;margin:0;z-index:2}
.avatar img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.avatar.photo{width:128px;height:160px;background:#0b1430}
.pod .avatar.sm.photo{width:104px;height:130px}.pod.p1 .avatar.sm.photo{width:128px;height:160px}
.avatar.xs.photo{width:44px;height:44px}
.rgrid{display:grid;grid-template-columns:52px repeat(12,1fr);gap:3px;font-variant-numeric:tabular-nums;margin-top:14px}
.rgrid div{font-size:11px;text-align:center;padding:5px 0}
.rgrid .hd{color:var(--mut);font-weight:700;letter-spacing:1px;font-size:10px}
.rgrid .yr{font:400 15px var(--disp);color:var(--mut);text-align:left}
.rgrid .c{font-weight:700}
.wsrank{display:inline-flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.wsrank b{font:400 22px var(--disp);color:var(--yel)}
#map{width:100%;height:auto;display:block}
#map path.c{stroke:rgba(140,170,255,.35);stroke-width:.5;transition:fill .3s}
#map path.c.has{cursor:pointer}#map path.c.has:hover{stroke:#fff;stroke-width:1.2}
#map .sph{fill:rgba(47,107,255,.035);stroke:rgba(140,170,255,.18)}
#map .grat{fill:none;stroke:rgba(255,255,255,.04)}
#map circle.dotc{stroke:#fff;stroke-width:.6;cursor:pointer}
.tip{position:fixed;pointer-events:none;background:#0d1838;border:1px solid var(--line);padding:8px 12px;font-size:12px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.tip b{font:400 18px var(--disp);display:block}
.scale{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-top:8px}
.scale i{display:block;width:220px;height:8px;background:linear-gradient(90deg,#14254f,#2f6bff,#8a7dff,#ffc61a)}
/* leaderboard */
.strip{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:26px 0 18px}
.strip .counters{margin-top:0}
.crit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:16px;align-items:end;margin-bottom:18px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--ink);background:var(--glass);border:1px solid var(--line);
  padding:22px 16px 0;backdrop-filter:blur(14px);position:relative;transition:transform .2s}
.pod:hover{transform:translateY(-4px);color:var(--ink)}
.pod .medal{position:absolute;top:-1px;left:-1px;font:400 30px/1 var(--disp);padding:8px 14px;color:#1b1400}
.pod.p1{border-color:rgba(255,198,26,.6);box-shadow:0 0 50px rgba(255,198,26,.18),inset 0 0 60px rgba(255,198,26,.08)}
.pod.p1 .medal{background:linear-gradient(135deg,#ffe27a,#ffc61a)}
.pod.p2 .medal{background:linear-gradient(135deg,#f2f5fb,#b9c2d6)}
.pod.p3 .medal{background:linear-gradient(135deg,#f0b07a,#c7743a)}
.pod .avatar.sm{width:76px;height:76px;font-size:32px}
.pod.p1 .avatar.sm{width:96px;height:96px;font-size:40px}
.pod .pn{font:400 26px/1.05 var(--disp);text-transform:uppercase;margin-top:16px}
.pod.p1 .pn{font-size:32px}
.pod .pc{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-top:4px}
.pod .pv{font:400 46px/1 var(--disp);margin-top:12px;color:#fff}
.pod.p1 .pv{font-size:60px;color:var(--yel);text-shadow:0 0 28px rgba(255,198,26,.45)}
.pod .ps{font-size:12px;color:var(--mut);margin-top:4px}
.pod .pd{display:flex;align-items:center;gap:10px;margin:14px 0 18px}
.pod .pdl{display:flex;flex-direction:column;font-size:11px;font-weight:600;text-align:left}
.pod .step{align-self:stretch;margin:0 -16px;height:26px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-top:1px solid var(--line)}
.pod.p1 .step{height:62px;background:linear-gradient(180deg,rgba(255,198,26,.22),rgba(255,198,26,.03))}
.pod.p2 .step{height:40px}
.board{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.brow{display:grid;grid-template-columns:56px 44px minmax(180px,1.4fr) 2fr 110px 44px;gap:14px;align-items:center;padding:10px 16px;
  background:var(--glass);border:1px solid var(--line);color:var(--ink);transition:background .15s,transform .15s}
.brow:hover{background:var(--glass2);transform:translateX(4px);color:var(--ink)}
.brow .bn{font:400 30px/1 var(--disp);color:var(--mut)}
.brow .bname b{font-weight:700;font-size:15px}
.brow .bname small{display:block;color:var(--mut);font-size:11.5px}
.brow .bbar{height:10px;background:rgba(255,255,255,.06);overflow:hidden}
.brow .bbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blu),#8a7dff,var(--yel))}
.brow .bv{font:400 28px/1 var(--disp);text-align:right}
.avatar.xs{width:44px;height:44px;font-size:18px;box-shadow:none}
@media (max-width:720px){
  .podium{grid-template-columns:1fr}.pod.p1{order:-1}
  .brow{grid-template-columns:40px 1fr 80px;}.brow .avatar,.brow .bbar{display:none}
}
.mrow{display:grid;grid-template-columns:150px 1fr 64px 120px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
.mbar{position:relative;height:14px;background:rgba(255,255,255,.06)}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blu),#8a7dff,var(--yel))}
.mbar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;box-shadow:0 0 6px #fff}
.mrow b{font:400 20px var(--disp);text-align:right}
.verdict{border-left:4px solid;padding:14px 18px;background:rgba(255,255,255,.03)}
.verdict .vt{font:400 30px/1 var(--disp);text-transform:uppercase;margin-bottom:8px}
.verdict p{margin:0;color:var(--ink);line-height:1.55}
.dowg{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.dow{background:rgba(255,255,255,.03);border:1px solid var(--line);padding:10px 8px;text-align:center}
.dow .dn{font:700 11px var(--body);letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.dow .dv{font:400 26px/1.2 var(--disp)}
.dow .dbar{position:relative;height:90px;background:rgba(255,255,255,.05);margin:6px auto;width:60%;display:flex;align-items:flex-end}
.dow .dbar i{display:block;width:100%;background:linear-gradient(0deg,var(--blu),#8a7dff,var(--yel))}
.dow .dbar em{position:absolute;left:-6px;right:-6px;height:2px;background:#fff;box-shadow:0 0 6px #fff}
.dow .dc{font-size:11px;color:var(--mut)}
.dow.best{border-color:rgba(255,198,26,.6);box-shadow:0 0 24px rgba(255,198,26,.15)}.dow.best .dv{color:var(--yel)}
.dow.worst{border-color:rgba(255,92,108,.5)}.dow.worst .dv{color:var(--loss)}
@media (max-width:720px){.dowg{grid-template-columns:repeat(4,1fr)}}
.grid>*{min-width:0}

<div class="toast" id="toast"></div>
<script>
/* ===================== fond animé : halos + particules ===================== */
(()=>{
  const c=document.getElementById('fx'),x=c.getContext('2d'),R=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,P=[],t=0,dpr=Math.min(devicePixelRatio||1,2);
  const size=()=>{W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
    const n=Math.round(Math.min(110,innerWidth*innerHeight/14000));
    P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.8+.4)*dpr,
      vx:(Math.random()-.5)*.18*dpr,vy:(-Math.random()*.25-.05)*dpr,y2:Math.random()<.5,ph:Math.random()*6.28}))};
  size();addEventListener('resize',size);
  const glow=(cx,cy,r,col)=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)};
  const frame=()=>{
    t+=R?0:.004;x.clearRect(0,0,W,H);
    x.globalCompositeOperation='lighter';
    glow(W*(.18+.06*Math.sin(t*1.3)),H*(.25+.08*Math.cos(t)),Math.max(W,H)*.55,'rgba(47,107,255,.20)');
    glow(W*(.85+.05*Math.cos(t*1.1)),H*(.75+.07*Math.sin(t*.9)),Math.max(W,H)*.5,'rgba(255,198,26,.11)');
    glow(W*(.55+.2*Math.sin(t*.6)),H*(.1+.05*Math.sin(t*1.7)),Math.max(W,H)*.3,'rgba(91,77,255,.10)');
    for(const p of P){
      if(!R){p.x+=p.vx;p.y+=p.vy;p.ph+=.02;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10}
      const a=.35+.35*Math.sin(p.ph);
      x.fillStyle=p.y2?`rgba(255,205,60,${a})`:`rgba(110,155,255,${a})`;
      x.shadowBlur=12*dpr;x.shadowColor=p.y2?'rgba(255,198,26,.9)':'rgba(47,107,255,.9)';
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
    }
    x.shadowBlur=0;x.globalCompositeOperation='source-over';
    if(!R)requestAnimationFrame(frame);
  };frame();
})();

/* ===================== données ===================== */
const $=s=>document.querySelector(s), M=$('#main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null||isNaN(v)?'–':v.toFixed(1)+'%';
const P100=(a,b)=>b?100*a/b:null;
const STAGE={round_robin:'Round robin',quarter_final:'Quarts',semi_final:'Demies',final:'Finale',petit_final:'Petite finale',repechage:'Repêchage',placing:'Classement',other:'Autre'};
let D, SK, EV, KEY2I;   // données brutes

async function load(){
  D=await fetch('data.json',{cache:'no-cache'}).then(r=>r.json());
  SK=D.skippers.map(([key,name,country,ws],i)=>({i,key,name,country,ws}));
  KEY2I=Object.fromEntries(SK.map(s=>[s.key,s.i]));
  EV=D.events.map(([year,title,url,date,boat,women,youth,grade,venue,vc,wst],i)=>({i,year,title,url,date,boat,women,youth,grade,venue,vc,wst,g:grade==null?99:grade==='W'?0:+grade}));
  // match -> objets
  const DAY0=Date.UTC(2010,0,1),dstr=d=>new Date(DAY0+d*864e5).toISOString().slice(0,10),hm=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  D.M=D.matches.map(([e,p,s,w,k,st,day,fl,pr,sr,pen,tm])=>({e,p,s,w,k:D.kinds[k],st:D.stages[st],date:day?dstr(day):(EV[e].date||String(EV[e].year)),hd:day>0,t:tm>=0?hm(tm):'',fl,
    pr:pr||(w===1?'1':w===2?'0':''),sr:sr||(w===2?'1':w===1?'0':''),pp:pen&1,ps:pen&2}));
  D.matches=null;D.ranks=null;
  D.M.forEach((m,i)=>m.ix=i);{let pe=-1,pk='';for(const m of D.M){if(m.e!==pe){pe=m.e;pk=''}const k=m.date+(m.t?'T'+m.t:'');m.sk=(m.t||k.slice(0,10)>pk.slice(0,10))?k:pk;pk=m.sk}}
  const evd=e=>EV[e].date||EV[e].year+'-07-01';D.M.sort((a,b)=>evd(a.e).localeCompare(evd(b.e))||a.e-b.e||a.sk.localeCompare(b.sk)||a.ix-b.ix);
  D.R=D.entries.map(([e,s,r])=>({e,s,r}));
}

/* ----- filtres (dans le hash, pour que le lien partagé garde tout) ----- */
function parseHash(){
  const [path,query]=location.hash.slice(1).split('?');
  return {parts:(path||'/').split('/').filter(Boolean).map(decodeURIComponent),q:new URLSearchParams(query||'')};
}
function filt(){return{y0:+$('#y0').value,y1:+$('#y1').value,women:+$('#women').value,youth:+$('#youth').value,grade:+$('#grade').value}}
function fq(){const f=filt(),o={};const ys=yearsAll();if(f.y0!==ys[0])o.y0=f.y0;if(f.y1!==ys[ys.length-1])o.y1=f.y1;if(f.women>=0)o.women=f.women;if(f.youth>=0)o.youth=f.youth;if(f.grade>=0)o.grade=f.grade;const s=new URLSearchParams(o).toString();return s?'?'+s:''}
const yearsAll=()=>[...new Set(EV.map(e=>e.year))].sort();
function evOK(e,f){const v=EV[e];return v.year>=f.y0&&v.year<=f.y1&&(f.women<0||v.women==f.women)&&(f.youth<0||v.youth==f.youth)&&(f.grade<0||v.g<=f.grade)}
function matchesF(){const f=filt();return D.M.filter(m=>evOK(m.e,f))}
const link=(path)=>'#'+path+fq();

/* ----- agrégats ----- */
function blank(){return{m:0,w:0,l:0,yw:0,yl:0,ym:0,bw:0,bl:0,bm:0,rw:0,rl:0,kw:0,kl:0,km:0,fw:0,fm:0,pen:0,ev:new Set(),y0:9999,y1:0,cur:0,lws:0,lls:0,prev:null}}
function add(a,m,side){ // side: 'p' (bleu) | 's' (jaune)
  const me=side==='p'?1:2, res=m.w===me?'W':(m.w===3-me?'L':(m.w===3?'D':'?')), yel=side==='s';
  a.m++;a.ev.add(m.e);const y=EV[m.e].year;a.y0=Math.min(a.y0,y);a.y1=Math.max(a.y1,y);
  if(res==='W')a.w++;if(res==='L')a.l++;
  if(yel){a.ym++;if(res==='W')a.yw++;if(res==='L')a.yl++}else{a.bm++;if(res==='W')a.bw++;if(res==='L')a.bl++}
  if(m.k==='round_robin'){if(res==='W')a.rw++;if(res==='L')a.rl++}else{a.km++;if(res==='W')a.kw++;if(res==='L')a.kl++}
  if(m.k==='final'){a.fm++;if(res==='W')a.fw++}
  if(side==='p'?m.pp:m.ps)a.pen++;
  if((res==='W'||res==='L')&&m.hd){const dk=m.e+'|'+m.date;if(a.dk!==dk){a.cur=0;a.dk=dk}if(res==='W'){a.cur=a.cur>0?a.cur+1:1;a.lws=Math.max(a.lws,a.cur)}else{a.cur=a.cur<0?a.cur-1:-1;a.lls=Math.max(a.lls,-a.cur)}}
  return res;
}
function finalize(a){a.pct=P100(a.w,a.w+a.l);a.ypct=P100(a.yw,a.yw+a.yl);a.bpct=P100(a.bw,a.bw+a.bl);a.rpct=P100(a.rw,a.rw+a.rl);a.kpct=P100(a.kw,a.kw+a.kl);a.nev=a.ev.size;return a}
function ranksF(){const f=filt(),t={};for(const r of D.R)if(evOK(r.e,f)){const o=t[r.s]??={ti:0,po:0};if(r.r===1)o.ti++;if(r.r<=3)o.po++}return t}

/* ----- ui helpers ----- */
const CN=c=>(D.countries[c]||[])[2]||c;
const cc=(c,big)=>!c?'':(D.countries[c]&&D.countries[c][0])?`<img class="flg${big?' big':''}" src="flags/${c}.svg" alt="${c}" title="${esc(CN(c))}" loading="lazy">`:`<span class="cc" title="${esc(CN(c))}">${esc(c)}</span>`;
const gb=g=>g==null?'<span class="mut">–</span>':`<span class="gr g${g}" title="Grade World Sailing">${g==='W'?'W':'G'+g}</span>`;
const skl=i=>`<a class="nm" href="${link('/skipper/'+encodeURIComponent(SK[i].key))}">${esc(SK[i].name)}</a>${cc(SK[i].country)}`;
const meter=v=>v==null?'':`<span class="meter"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></span>`;
const duel=(y,b)=>y==null||b==null?'':`<span class="duel" title="jaune ${pct(y)} · bleu ${pct(b)}"><i style="width:${50+(y-b)/2}%;background:linear-gradient(90deg,#b98a00,var(--yel))"></i><i style="flex:1;background:linear-gradient(90deg,var(--blu2),var(--blu))"></i></span>`;
/* donut : victoires en bleu | victoires en jaune | défaites ; % victoires au centre */
function donut(a,size=200,{label=true}={}){
  const tot=a.bw+a.yw+a.l, r=40, C=2*Math.PI*r, sw=label?11:14;
  if(!tot)return'';
  const segs=[[a.bw,'url(#dgB)'],[a.yw,'url(#dgY)'],[a.l,'rgba(255,255,255,.13)']];
  let off=0, gap=tot>1?1.2:0, out='';
  for(const [v,c] of segs){if(!v)continue;const len=C*v/tot;
    out+=`<circle class="seg" r="${r}" cx="50" cy="50" fill="none" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${Math.max(len-gap,.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"><title>${c.includes('B')?'victoires en bleu':c.includes('Y')?'victoires en jaune':'défaites'} : ${v}</title></circle>`;off+=len}
  const p=100*a.w/(a.w+a.l||1);
  return `<svg class="donut" viewBox="0 0 100 100" width="${size}" height="${size}" style="filter:drop-shadow(0 0 ${label?18:6}px rgba(47,107,255,.35))">
    <defs><linearGradient id="dgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f9bff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient>
    <linearGradient id="dgY" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffc61a"/></linearGradient></defs>
    <circle r="${r}" cx="50" cy="50" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="${sw}"/>${out}
    ${label?`<text class="ctr" x="50" y="${p>=99.95?55:56}" text-anchor="middle" font-size="${p>=99.95?17:19}">${p.toFixed(1)}%</text><text class="sub" x="50" y="66" text-anchor="middle">victoires</text>`:''}</svg>`;
}
const delta=(y,b)=>y==null||b==null?'–':`<span style="color:${y>=b?'var(--yel)':'var(--blu2)'}">${y>=b?'+':''}${(y-b).toFixed(1)}</span>`;
function alignHeads(){document.querySelectorAll('table').forEach(t=>{const r=t.tBodies[0]?.rows[0];if(!r)return;t.querySelectorAll('thead th').forEach((th,i)=>{if(r.cells[i]?.classList.contains('l'))th.classList.add('l')})})}
new MutationObserver(alignHeads).observe(document.getElementById('main'),{childList:true,subtree:true});
function sortable(tbl){
  tbl.querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{
    const tb=tbl.tBodies[0],rows=[...tb.rows],asc=th.dataset.s!=='a';
    tbl.querySelectorAll('th').forEach(t=>delete t.dataset.s);th.dataset.s=asc?'a':'d';
    const v=r=>{const c=r.cells[i];const s=c.dataset.v??c.textContent.trim();const n=parseFloat(s.replace('%','').replace(',','.'));return isNaN(n)?s.toLowerCase():n};
    rows.sort((a,b)=>{const x=v(a),y=v(b);return(x>y?1:x<y?-1:0)*(asc?1:-1)});rows.forEach(r=>tb.appendChild(r));
    tbl.querySelectorAll('.rank').forEach((c,j)=>c.textContent=j+1);
  });
}
function yearChart(rows,series,{h=220,yMin=0,yMax=100,ref=null}={}){
  const W=Math.max(380,rows.length*52),pad=30,bw=(W-pad-6)/Math.max(rows.length,1);
  const y=v=>h-22-((Math.min(Math.max(v,yMin),yMax)-yMin)/(yMax-yMin))*(h-38);
  let s=`<svg viewBox="0 0 ${W} ${h}" width="100%" style="max-height:${h}px;overflow:visible"><defs>`;
  series.forEach((se,j)=>s+=`<linearGradient id="g${j}${se.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.c}"/><stop offset="1" stop-color="${se.c}" stop-opacity=".25"/></linearGradient>`);
  s+='</defs>';
  [0,1,2,3,4].map(i=>yMin+i*(yMax-yMin)/4).forEach(t=>s+=`<line x1="${pad}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.06)"/><text x="0" y="${y(t)+4}">${t}</text>`);
  if(ref!=null)s+=`<line x1="${pad}" x2="${W}" y1="${y(ref)}" y2="${y(ref)}" stroke="rgba(255,255,255,.35)" stroke-dasharray="4 4"/>`;
  rows.forEach((r,i)=>{const x0=pad+i*bw,w=(bw-10)/series.length;
    series.forEach((se,j)=>{const v=se.v(r);if(v==null)return;
      s+=`<rect x="${x0+5+j*w}" y="${y(v)}" width="${Math.max(w-2,2)}" height="${h-22-y(v)}" fill="url(#g${j}${se.id})"><title>${r.year} · ${se.n} : ${pct(v)}${se.t?' ('+se.t(r)+')':''}</title></rect>`});
    s+=`<text x="${x0+bw/2}" y="${h-5}" text-anchor="middle">${String(r.year).slice(2)}</text>`});
  return s+'</svg><div class="legend">'+series.map(se=>`<span><i style="background:${se.c}"></i>${se.n}</span>`).join('')+'</div>';
}
function rankChart(rows){
  const T={o:{c:'#2f6bff',n:'Open'},w:{c:'#ffc61a',n:'Women'}}, pts=rows.map(r=>({t:r[0],d:new Date(r[1]),p:r[2],ds:r[1]}));
  const t0=Math.min(...pts.map(p=>+p.d)),t1=Math.max(...pts.map(p=>+p.d)),pm=Math.max(10,...pts.map(p=>p.p));
  const W=900,h=220,pl=40,pr=16,pt=14,pb=24, x=d=>pl+(t1===t0?0.5:(d-t0)/(t1-t0))*(W-pl-pr), y=p=>pt+(Math.log(p)/Math.log(pm))*(h-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${h}" width="100%" style="max-height:${h}px">`;
  [1,3,10,30,100,300,1000].filter(v=>v<=pm).forEach(v=>s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.06)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">#${v}</text>`);
  for(let yr=new Date(t0).getFullYear();yr<=new Date(t1).getFullYear();yr++){const d=+new Date(yr,0,1);if(d>=t0&&d<=t1)s+=`<text x="${x(d)}" y="${h-6}" text-anchor="middle">${String(yr).slice(2)}</text>`}
  for(const k of ['o','w']){const p=pts.filter(q=>q.t===k).sort((a,b)=>a.d-b.d);if(!p.length)continue;
    const segs=[[]];p.forEach((q,j)=>{if(j&&(q.d-p[j-1].d)>125*864e5)segs.push([]);segs.at(-1).push(q)});
    for(const sg of segs)s+=`<polyline fill="none" stroke="${T[k].c}" stroke-width="2.2" points="${sg.map(q=>x(+q.d)+','+y(q.p)).join(' ')}" style="filter:drop-shadow(0 0 6px ${T[k].c})"/>`;

}

function picker(id,ph){return`<div class="search"><input id="${id}" placeholder="${ph}" autocomplete="off"><div class="sugg" id="${id}s" hidden></div></div>`}
function bindPicker(id,cb){
  const i=$('#'+id),s=$('#'+id+'s');let r=[],sel=0;
  const nz=v=>v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const starts=(x,q)=>nz(x.name).startsWith(q)||x.key.split(' ').some(w=>w.startsWith(q));
  const pick=k=>{if(!r[k])return;s.hidden=true;i.value=r[k].name;i.blur();cb(r[k].i)};
  const draw=()=>{s.innerHTML=r.map((x,k)=>`<div data-k="${k}" class="${k===sel?'on':''}"><span class="avatar xs${avCls(x.i)}">${avIn(x.i,false)}</span><b>${esc(x.name)}</b>${cc(x.country)}</div>`).join('');s.hidden=!r.length};
  i.oninput=()=>{const q=nz(i.value.trim());if(q.length<2){s.hidden=true;r=[];return}
    r=SK.filter(x=>x.key.includes(q)||nz(x.name).includes(q)).sort((a,b)=>starts(b,q)-starts(a,q)).slice(0,10);sel=0;draw()};
  s.onmousedown=e=>e.preventDefault();             // garde le focus : la liste ne disparaît pas avant le clic
  s.onclick=e=>{const d=e.target.closest('[data-k]');if(d)pick(+d.dataset.k)};
  i.onkeydown=e=>{if(s.hidden||!r.length)return;
    if(e.key==='ArrowDown'){sel=Math.min(sel+1,r.length-1);draw();e.preventDefault()}
    else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}
    else if(e.key==='Enter'){pick(sel);e.preventDefault()}else if(e.key==='Escape')s.hidden=true};
  i.onfocus=()=>{if(r.length)s.hidden=false};
  i.onblur=()=>setTimeout(()=>s.hidden=true,150);
}

// Pas d'horodatage, mais la date du jour (schedule) + le n° de match donnent l'ordre réel dans une journée.

function runsZ(segs){let R=0,E=0,V=0;

    if(same(PP,P)&&same(P,x)&&P.res===PP.res)o.t2[PP.res+P.res+r]++;
    if(!run||run.r!==r||day(run.to)!==day(x)){run={r,len:0,from:x,to:x}}
    run.len++;run.to=x;
    const best=r==='W'?o.lw:o.ll;if(run.len>best.len)Object.assign(best,{len:run.len,m:x.m});
  });
  // journées
  const D_={};for(const x of seq){const d=D_[day(x)]??={w:0,l:0,m:x.m};x.res==='W'?d.w++:d.l++}
  for(const d of Object.values(D_)){o.days++;if(d.l===0&&d.w>=4)o.perfect++;if(!o.bestDay||d.w>o.bestDay.w||(d.w===o.bestDay.w&&d.l<o.bestDay.l))o.bestDay=d}
  o.W=seq.filter(x=>x.res==='W').length;o.base=P100(o.W,seq.length);
  o.afterW=P100(o.tr.WW,o.tr.WW+o.tr.WL);o.afterL=P100(o.tr.LW,o.tr.LW+o.tr.LL);
  o.after2W=P100(o.t2.WWW,o.t2.WWW+o.t2.WWL);o.after2L=P100(o.t2.LLW,o.t2.LLW+o.t2.LLL);
  const segs=[];let cur=null;for(const x of seq){if(x.m.k!=='round_robin')continue;const g=day(x)+'|'+x.m.st;if(!cur||cur.g!==g){cur={g,r:[]};segs.push(cur)}cur.r.push(x.res)}
  o.inEv=runsZ(segs.map(s=>s.r));
  // valeurs attendues si l'ordre des matchs de la journée était aléatoire
  const ex={WW:0,WL:0,LW:0,LL:0,WWW:0,WWL:0,LLW:0,LLL:0};
  for(const sg of segs){const n=sg.r.length,W=sg.r.filter(r=>r==='W').length,L=n-W;if(n<2)continue;
    ex.WW+=W*(W-1)/n;ex.WL+=W*L/n;ex.LW+=W*L/n;ex.LL+=L*(L-1)/n;
    if(n>=3){const d=n*(n-1);ex.WWW+=W*(W-1)*(W-2)/d;ex.WWL+=W*(W-1)*L/d;ex.LLW+=L*(L-1)*W/d;ex.LLL+=L*(L-1)*(L-2)/d}}
  o.expW=P100(ex.WW,ex.WW+ex.WL);o.expL=P100(ex.LW,ex.LW+ex.LL);o.exp2W=P100(ex.WWW,ex.WWW+ex.WWL);o.exp2L=P100(ex.LLW,ex.LLW+ex.LLL);
  o.dated=P100(seq.length,list.filter(x=>x.res==='W'||x.res==='L').length);
  // heure du résultat (fil live) : moment de la journée, 1er match du jour, temps depuis son match précédent
  const mins=x=>x.m.t?(+x.m.t.slice(0,2))*60+(+x.m.t.slice(3)):null,wp=xs=>({c:xs.length,p:P100(xs.filter(x=>x.res==='W').length,xs.length)});
  o.tod=[['avant 12 h',0,720],['12 h – 14 h',720,840],['14 h – 16 h',840,960],['après 16 h',960,1440]].map(([n,a,b])=>({n,...wp(seq.filter(x=>{const v=mins(x);return v!=null&&v>=a&&v<b}))}));
  const first=[],G=[[],[],[]];
  seq.forEach((x,i)=>{const P=seq[i-1];if(!P||day(P)!==day(x)){first.push(x);return}const a=mins(P),b=mins(x);if(a==null||b==null||b<a)return;const g=b-a;G[g<30?0:g<60?1:2].push(x)});

  o.gap=[['moins de 30 min',G[0]],['30 à 60 min',G[1]],['plus d\'1 h',G[2]]].map(([n,xs])=>({n,...wp(xs)}));
  o.timed=seq.filter(x=>x.m.t).length;
  // jour de la semaine (date locale de l'event)
  const dow=x=>{const[y,m,d]=x.m.date.split('-').map(Number);return(new Date(y,m-1,d).getDay()+6)%7};
  o.dow=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'].map((n,k)=>({n,...wp(seq.filter(x=>dow(x)===k))}));
  return o;
}
function verdict(mo){
  const z=mo.inEv.z;
  if(z==null||mo.tr.WW+mo.tr.WL<15||mo.tr.LW+mo.tr.LL<15)return{t:'Pas assez de matchs',d:'Il faut davantage de matchs enchaînés dans une même journée de round robin pour conclure.',c:'var(--mut)'};
  if(z<=-2)return{t:'Joue en séries',d:`Dans une journée, ses victoires et ses défaites s'enchaînent plus que par hasard (test des runs z = ${z.toFixed(1)}). Après une défaite il gagne ${pct(mo.afterL)} au match suivant, pour ${pct(mo.expL)} attendus : une défaite tend à en entraîner d'autres.`,c:'var(--loss)'};
  if(z>=2)return{t:'Rebondit',d:`Dans une journée, il alterne plus que le hasard (z = +${z.toFixed(1)}) : après une défaite il gagne ${pct(mo.afterL)} au match suivant, pour ${pct(mo.expL)} attendus.`,c:'var(--win)'};
  return{t:'Pas d\'effet momentum',d:`Dans une journée, l'enchaînement de ses résultats est compatible avec le hasard (z = ${z>0?'+':''}${z.toFixed(1)}). Après une défaite : ${pct(mo.afterL)} de victoires au match suivant, pour ${pct(mo.expL)} attendus.`,c:'var(--blu2)'};
}
const dayLabel=m=>`${m.date}<br><span class="mut">${esc(EV[m.e].title)}</span>`;
function tbar(b,base){const d=b.p!=null?b.p-base:null;return`<div class="mrow"><span>${b.n}</span><span class="mbar"><i style="width:${b.p??0}%"></i><em style="left:${base}%"></em></span><b>${b.c>=8?pct(b.p):'–'}</b><small class="mut">${b.c} matchs${b.c>=8&&d!=null?` · <span style="color:${d>=0?'var(--win)':'var(--loss)'}">${d>=0?'+':''}${d.toFixed(1)}</span>`:''}</small></div>`}
function momentumCard(mo){
  const v=verdict(mo),bd=mo.bestDay;
  const bar=(lab,val,exp,n)=>{const d=val!=null&&exp!=null?val-exp:null;return`<div class="mrow"><span>${lab}</span><span class="mbar"><i style="width:${val??0}%"></i><em style="left:${exp??0}%" title="attendu si hasard : ${pct(exp)}"></em></span><b>${pct(val)}</b><small style="color:${d==null?'var(--mut)':d>=0?'var(--win)':'var(--loss)'}">${d==null?'':(d>=0?'+':'')+d.toFixed(1)+' pts'}</small></div>`};
  return `<div class="card fade"><h2>Séries &amp; momentum <small>dans une même journée · ordre = heure du résultat (fil live), à défaut n° de match · ${pct(mo.dated)} de ses matchs sont datés</small></h2>
   <div class="tiles" style="margin-bottom:14px">
    <div class="tile"><div class="v W">${mo.lw.len}</div><div class="l">plus longue série de victoires sur une journée</div><div class="note" style="margin-top:6px">${mo.lw.len?dayLabel(mo.lw.m):''}</div></div>
    <div class="tile"><div class="v L">${mo.ll.len}</div><div class="l">plus longue série de défaites sur une journée</div><div class="note" style="margin-top:6px">${mo.ll.len?dayLabel(mo.ll.m):''}</div></div>
    <div class="tile"><div class="v" style="color:var(--yel)">${mo.perfect}</div><div class="l">journées parfaites<br>≥ 4 matchs, 0 défaite · sur ${mo.days} jours</div></div>
    <div class="tile"><div class="v">${bd?`<span class="W">${bd.w}</span>–<span class="L">${bd.l}</span>`:'–'}</div><div class="l">meilleure journée</div><div class="note" style="margin-top:6px">${bd?dayLabel(bd.m):''}</div></div>
    <div class="tile"><div class="v">${mo.inEv.z==null?'–':(mo.inEv.z>0?'+':'')+mo.inEv.z.toFixed(1)}</div><div class="l">indice momentum (z)<br>&lt; −2 séries · &gt; +2 rebond</div></div>
   </div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div>${bar('Après une victoire',mo.afterW,mo.expW,mo.tr.WW+mo.tr.WL)}${bar('Après une défaite',mo.afterL,mo.expL,mo.tr.LW+mo.tr.LL)}
      ${bar('Après 2 victoires',mo.after2W,mo.exp2W,mo.t2.WWW+mo.t2.WWL)}${bar('Après 2 défaites',mo.after2L,mo.exp2L,mo.t2.LLW+mo.t2.LLL)}
      <div class="note">% de victoires au match suivant, même journée de round robin · trait blanc = attendu si l'ordre des matchs de la journée était aléatoire · écart en points</div></div>
    <div class="verdict" style="border-color:${v.c}"><div class="vt" style="color:${v.c}">${v.t}</div><p>${v.d}</p></div>
   </div>
   ${mo.timed>=30?`<h2 style="margin-top:22px;font-size:17px">Selon l'heure <small>${mo.timed} matchs horodatés par le fil live · trait blanc = sa moyenne (${pct(mo.base)})</small></h2>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div>${mo.tod.map(b=>tbar(b,mo.base)).join('')}${tbar(mo.first,mo.base)}</div>
    <div><div class="note" style="margin:0 0 8px">Temps écoulé depuis la fin de son match précédent (même journée)</div>${mo.gap.map(b=>tbar(b,mo.base)).join('')}</div>
   </div>`:''}
   ${mo.n>=30?(()=>{const ok=mo.dow.filter(b=>b.c>=15),best=ok.length?ok.reduce((a,b)=>b.p>a.p?b:a):null,worst=ok.length?ok.reduce((a,b)=>b.p<a.p?b:a):null;
     return`<h2 style="margin-top:22px;font-size:17px">Selon le jour de la semaine <small>${best&&worst&&best!==worst?`son jour : <b style="color:var(--yel)">${best.n.toLowerCase()}</b> (${pct(best.p)}) · son jour sans : <b style="color:var(--loss)">${worst.n.toLowerCase()}</b> (${pct(worst.p)})`:''}</small></h2>
     <div class="dowg">${mo.dow.map(b=>`<div class="dow${b===best?' best':''}${b===worst?' worst':''}"><div class="dn">${b.n.slice(0,3)}</div><div class="dv">${b.c>=8?Math.round(b.p)+'%':'–'}</div><div class="dbar"><i style="height:${b.c>=8?b.p:0}%"></i><em style="bottom:${mo.base}%"></em></div><div class="dc">${b.c} m.</div></div>`).join('')}</div>`})():''}</div>`;
}

/* ===================== routing / partage ===================== */

  if(r==='skipper'){if(D.ranks)viewSkipper(parts[1]);else fetch('ranks.json',{cache:'no-cache'}).then(x=>x.json()).then(x=>{D.ranks=x;viewSkipper(parts[1])}).catch(()=>{D.ranks={};viewSkipper(parts[1])})}else if(r==='h2h')viewH2H(parts[1],parts[2]);
  else if(r==='colours')viewColours();else if(r==='countries')viewCountries();else if(r==='country')viewCountry(parts[1]);else if(r==='events')viewEvents();else viewBoard();
